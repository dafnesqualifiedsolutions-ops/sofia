<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sofia — Bilingual AI Phone Assistant | Riviera Maya</title>
<style>
  :root {
    --bg: #0b1220;
    --card: #121b2e;
    --accent: #2dd4bf;
    --accent2: #f59e0b;
    --text: #e5e7eb;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, var(--bg), #0f1729);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  .lang-toggle {
    align-self: flex-end;
    margin-bottom: 20px;
    display: flex;
    gap: 8px;
  }
  .lang-toggle button {
    background: var(--card);
    color: var(--muted);
    border: 1px solid #1e293b;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
  }
  .lang-toggle button.active {
    background: var(--accent);
    color: #0b1220;
    border-color: var(--accent);
    font-weight: 600;
  }
  header {
    text-align: center;
    max-width: 640px;
    margin-bottom: 32px;
  }
  header h1 {
    font-size: 2rem;
    margin-bottom: 12px;
    line-height: 1.2;
  }
  header h1 span { color: var(--accent); }
  header p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.5;
  }
  .talk-btn {
    background: linear-gradient(135deg, var(--accent), #14b8a6);
    color: #05221d;
    border: none;
    border-radius: 50px;
    padding: 20px 48px;
    font-size: 1.25rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(45,212,191,0.35);
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .talk-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(45,212,191,0.45); }
  .talk-btn:active { transform: translateY(0); }
  .talk-btn.calling {
    background: linear-gradient(135deg, var(--accent2), #d97706);
    box-shadow: 0 10px 30px rgba(245,158,11,0.35);
  }
  .mic-icon { width: 22px; height: 22px; fill: currentColor; }
  .status-line {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 40px;
    min-height: 20px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    max-width: 1000px;
    width: 100%;
    margin-bottom: 40px;
  }
  @media (max-width: 800px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .cards { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card);
    border: 1px solid #1e293b;
    border-radius: 16px;
    padding: 22px;
  }
  .card h3 {
    color: var(--accent);
    font-size: 1.05rem;
    margin-bottom: 8px;
  }
  .card p {
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.45;
  }
  .how-it-works {
    max-width: 700px;
    width: 100%;
    margin-bottom: 40px;
  }
  .how-it-works h2 {
    text-align: center;
    margin-bottom: 20px;
    color: var(--text);
  }
  .steps {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .step {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--card);
    border-radius: 12px;
    padding: 16px 20px;
    border: 1px solid #1e293b;
  }
  .step .num {
    background: var(--accent);
    color: #05221d;
    font-weight: 700;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .step p { color: var(--muted); font-size: 0.95rem; line-height: 1.4; }
  footer {
    color: #cbd5e1;
    font-size: 0.9rem;
    text-align: center;
    margin-top: 20px;
    opacity: 0.85;
  }
  #vapi-widget-container {
    position: fixed;
    bottom: 0; right: 0;
    width: 0; height: 0;
    overflow: hidden;
  }
  .hidden { display: none; }

  .pricing { max-width: 720px; width: 100%; margin-bottom: 40px; text-align: center; }
  .pricing h2 { margin-bottom: 20px; color: var(--text); }
  .price-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .price-card { background: var(--card); border: 1px solid #1e293b; border-radius: 16px; padding: 24px; flex: 1; min-width: 220px; }
  .price-card h3 { color: var(--accent); font-size: 1.1rem; margin-bottom: 10px; }
  .price { font-size: 2rem; font-weight: 800; color: var(--text); margin-bottom: 8px; }
  .price span { font-size: 1rem; color: var(--muted); font-weight: 600; }
  .price-card p { color: var(--muted); font-size: 0.92rem; line-height: 1.45; }

</style>
</head>
<body>

  <div class="lang-toggle">
    <button id="btn-en" class="active" onclick="setLang('en')" aria-label="English" title="English">🇺🇸</button>
    <button id="btn-es" onclick="setLang('es')" aria-label="Español" title="Español">🇲🇽</button>
  </div>

  <header>
    <h1 data-en='Never miss a call again — in <span>English or Spanish</span>.'
        data-es='Nunca pierdas una llamada — en <span>inglés o español</span>.'>'
    
    <p data-en="Sofia is a bilingual AI phone assistant for local businesses in the Riviera Maya. She answers calls, books appointments, and helps tourists — 24/7, at a flat low monthly cost."
       data-es="Sofia es una asistente telefónica de IA bilingüe para negocios locales en la Riviera Maya. Contesta llamadas, agenda citas y ayuda a turistas — las 24 horas, por una tarifa mensual baja y fija.">"
    
  </header>

  <button class="talk-btn" id="talkBtn" onclick="toggleCall()">
    <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    <span id="talkBtnText" data-en="Talk to Sofia now" data-es="Habla con Sofia ahora"></span>
  </button>
  <div class="status-line" id="statusLine" data-en="Click to start a free voice call — right in your browser, no phone number needed."
       data-es="Haz clic para iniciar una llamada de voz gratuita — directo en tu navegador, sin necesidad de número de teléfono.">
  </div>

  <div class="cards">
    <div class="card">
      <h3 data-en="🏠 Real Estate &amp; Airbnb" data-es="🏠 Bienes Raíces y Airbnb">"
      <p data-en="Answers inquiries, checks availability, books viewings and check-ins in both languages." data-es="Responde consultas, revisa disponibilidad, agenda visitas y check-ins en ambos idiomas.">"
    </div>
    <div class="card">
      <h3 data-en="💈 Barber Shops" data-es="💈 Barberías">"
      <p data-en="Books appointments and answers questions from expats who don't speak Spanish." data-es="Agenda citas y responde preguntas de expatriados que no hablan español.">"
    </div>
    <div class="card">
      <h3 data-en="🧺 Lavanderías" data-es="🧺 Lavanderías">"
      <p data-en="Takes pickup/drop-off requests and order status calls, in English or Spanish." data-es="Recibe solicitudes de recogida/entrega y llamadas de estado de pedidos.">"
    </div>
    <div class="card">
      <h3 data-en="🛥️ Tours &amp; Excursions" data-es="🛥️ Tours y Excursiones">"
      <p data-en="Sofia can also recommend yacht charters, dolphin swims, and local tours to your guests." data-es="Sofia también puede recomendar chárteres de yate, natación con delfines y tours locales a tus huéspedes.">"
    </div>
  </div>

  <div class="how-it-works">
    <h2 data-en="How it works" data-es="Cómo funciona">"
    <div class="steps">
      <div class="step">
        <div class="num">1</div>
        <p data-en="We set Sofia up with your business info — hours, pricing, services." data-es="Configuramos a Sofia con la información de tu negocio — horarios, precios, servicios.">"
      </div>
      <div class="step">
        <div class="num">2</div>
        <p data-en="Your customers call the same number they always have — Sofia answers instantly, in their language." data-es="Tus clientes llaman al mismo número de siempre — Sofia responde al instante, en su idioma.">"
      </div>
      <div class="step">
        <div class="num">3</div>
        <p data-en="You get the booking details sent straight to you. No missed calls, no language barrier." data-es="Recibes los detalles de la reserva directamente. Sin llamadas perdidas, sin barrera de idioma.">"
      </div>
    </div>
  </div>

    <div class="pricing">
    <h2 data-en="Simple, flat pricing" data-es="Precio fijo y simple">"
    <div class="price-row">
      <div class="price-card">
        <h3 data-en="One-time setup" data-es="Configuración única">"
        <div class="price">$2,000 <span>MXN</span></div>
        <p data-en="We set Sofia up with your business info — hours, pricing, services." data-es="Configuramos a Sofia con la información de tu negocio — horarios, precios, servicios.">"
      </div>
      <div class="price-card">
        <h3 data-en="Monthly" data-es="Mensual">"
        <div class="price">$2,000 <span>MXN/mo</span></div>
        <p data-en="Flat rate. 24/7 bilingual reception — no per-call fees, ever." data-es="Tarifa fija. Recepción bilingüe 24/7 — sin costo por llamada, nunca.">"
      </div>
    </div>
  </div>


  <footer data-en="A demo by Yan — Puerto Morelos, Quintana Roo. Click 'Talk to Sofia' above to try it live."
          data-es="Una demostración de Yan — Puerto Morelos, Quintana Roo. Haz clic en 'Habla con Sofia' arriba para probarlo en vivo.">"
  

<script defer src="https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/dist/vapi.min.js"></script>
<script>
  // ====== CONFIG: fill these in ======
  const VAPI_PUBLIC_KEY = "pk-67bd7d4d-e8cf-4afc-b26b-a1a54fd45568";
  const VAPI_ASSISTANT_ID = "4c5df6a4-bc7f-47b7-a2fd-7cfae3cfccb1"; // Sofia - Master Sales Caller (default demo)
  // ====================================

  let vapi = null;
  let inCall = false;

  function setLang(lang) {
    document.querySelectorAll('[data-en]').forEach(el => {
      el.innerHTML = el.getAttribute('data-' + lang);
    });
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-es').classList.toggle('active', lang === 'es');
    localStorage.setItem('sofia_lang', lang);
  }

  async function toggleCall() {
    const btn = document.getElementById('talkBtn');
    const status = document.getElementById('statusLine');
    const lang = localStorage.getItem('sofia_lang') || 'en';

    if (!inCall) {
      if (!vapi) {
        vapi = new Vapi(VAPI_PUBLIC_KEY);
        vapi.on('call-start', () => {
          inCall = true;
          btn.classList.add('calling');
          document.getElementById('talkBtnText').textContent = (lang === 'es') ? 'Colgar' : 'Hang up';
          status.textContent = (lang === 'es') ? 'Conectado — habla con Sofia ahora.' : 'Connected — talk to Sofia now.';
        });
        vapi.on('call-end', () => {
          inCall = false;
          btn.classList.remove('calling');
          document.getElementById('talkBtnText').textContent = (lang === 'es') ? 'Habla con Sofia ahora' : 'Talk to Sofia now';
          status.textContent = (lang === 'es') ? 'Llamada finalizada. Haz clic para intentarlo de nuevo.' : 'Call ended. Click to try again.';
        });
        vapi.on('error', (e) => {
          console.error('Vapi error', e);
          status.textContent = (lang === 'es') ? 'Error de conexión — revisa el micrófono del navegador.' : 'Connection error — check your browser microphone permissions.';
        });
      }
      status.textContent = (lang === 'es') ? 'Conectando...' : 'Connecting...';
      try {
        await vapi.start(VAPI_ASSISTANT_ID);
      } catch (e) {
        console.error(e);
        status.textContent = (lang === 'es') ? 'No se pudo conectar. Revisa permisos de micrófono.' : 'Could not connect. Check microphone permissions.';
      }
    } else {
      vapi.stop();
    }
  }

  // restore language preference
  try { setLang(localStorage.getItem('sofia_lang') || 'en'); } catch(e) { setLang('en'); }
</script>
</body>
</html>
